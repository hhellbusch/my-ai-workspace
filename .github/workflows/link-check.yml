name: Markdown checks

on:
  pull_request:
    paths:
      - '**.md'
      - 'scripts/check-markdown-links.sh'
      - 'scripts/check-review-frontmatter.py'
      - '.githooks/pre-commit'
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'scripts/check-markdown-links.sh'
      - 'scripts/check-review-frontmatter.py'
      - '.githooks/pre-commit'

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check internal markdown links
        run: bash scripts/check-markdown-links.sh

  review-frontmatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PyYAML
        run: pip install 'pyyaml>=6.0'
      - name: Check review frontmatter on changed files
        run: python3 scripts/check-review-frontmatter.py --ci
