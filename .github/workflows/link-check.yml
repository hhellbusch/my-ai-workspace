name: Link check

on:
  pull_request:
    paths:
      - '**.md'
      - 'scripts/check-markdown-links.sh'
  push:
    branches: [main]
    paths:
      - '**.md'
      - 'scripts/check-markdown-links.sh'

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Check internal markdown links
        run: bash scripts/check-markdown-links.sh
