---
# Develop AAP. Apply target, not a product tree.
# product_org is the durable org on this controller.
# content_revision defaults from ocp-day2/versions.yml unless overridden.

all:
  children:
    aap_instances:
      hosts:
        localhost:
          ansible_connection: local
      vars:
        aap_hostname: https://aap-develop.example.com
        product_org: Team-OCP
        # content_revision omitted. Playbook uses durable_content_revision from versions.yml.
