# Inventory for live preflight when network.probe_from is not localhost.
# Copy to a local path (gitignored) and set INVENTORY= when running run-live.sh.
#
# Usage:
#   cp examples/live-inventory.example.ini ~/live-preflight-inventory.ini
#   # edit ansible_host / ansible_user
#   INVENTORY=~/live-preflight-inventory.ini ./scripts/run-live.sh my-live-vars.json

[probe_hosts]
bastion ansible_host=BASTION_IP ansible_user=ansible

[all:vars]
ansible_python_interpreter=/usr/bin/python3
