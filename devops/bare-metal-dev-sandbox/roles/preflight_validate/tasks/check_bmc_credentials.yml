---
- name: BMC credentials — resolve host list
  ansible.builtin.set_fact:
    _bmc_hosts: "{{ preflight_inputs.bmc.hosts | default([]) }}"
    _bmc_creds: "{{ preflight_inputs.bmc.credentials | default({}) }}"

- name: BMC credentials — resolve username/password (config first, then env for live)
  ansible.builtin.set_fact:
    _bmc_user: >-
      {%- if _bmc_creds.username | default('') | length > 0 -%}
      {{ _bmc_creds.username }}
      {%- else -%}
      {{ lookup('env', 'BMC_USERNAME') | default(lookup('env', 'BMC_USER'), true) }}
      {%- endif -%}
    _bmc_pass: >-
      {%- if _bmc_creds.password | default('') | length > 0 -%}
      {{ _bmc_creds.password }}
      {%- else -%}
      {{ lookup('env', 'BMC_PASSWORD') }}
      {%- endif -%}

- name: BMC credentials — fail when inventory empty
  ansible.builtin.set_fact:
    preflight_findings: >-
      {{ preflight_findings + [{
        'id': 'bmc_redfish_authentication',
        'message': 'No BMC hosts defined in preflight_inputs.bmc.hosts'
      }] }}
    preflight_bmc_cred_failed: true
    preflight_skip_bmc_hardware: true
  when: _bmc_hosts | length == 0

- name: BMC credentials — fail when username or password empty
  ansible.builtin.set_fact:
    preflight_findings: >-
      {{ preflight_findings + [{
        'id': 'bmc_redfish_authentication',
        'message': 'BMC credentials username/password must be non-empty'
          ~ (' (set BMC_USERNAME/BMC_PASSWORD env in live mode)' if validation_mode == 'live' else '')
      }] }}
    preflight_bmc_cred_failed: true
    preflight_skip_bmc_hardware: true
  when:
    - _bmc_hosts | length > 0
    - (_bmc_user | default('') | length == 0)
      or (_bmc_pass | default('') | length == 0)

- name: BMC credentials — harness/hybrid simulated auth failure
  ansible.builtin.set_fact:
    preflight_findings: >-
      {{ preflight_findings + [{
        'id': 'bmc_redfish_authentication',
        'message': 'BMC ' ~ (_bmc_hosts[0].name | default(_bmc_hosts[0].address))
          ~ ' (' ~ _bmc_hosts[0].address ~ ') Redfish auth failed (harness: auth_ok=false).'
      }] }}
    preflight_bmc_cred_failed: true
    preflight_skip_bmc_hardware: true
  when:
    - _bmc_hosts | length > 0
    - validation_mode in ['harness', 'hybrid']
    - not (_bmc_creds.auth_ok | default(true) | bool)

- name: BMC credentials — probe each endpoint
  when:
    - _bmc_hosts | length > 0
    - not preflight_bmc_cred_failed | bool
  ansible.builtin.uri:
    url: "https://{{ item.address }}:{{ item.port | default(443) }}/redfish/v1/"
    user: "{{ _bmc_user }}"
    password: "{{ _bmc_pass }}"
    force_basic_auth: true
    validate_certs: false
    status_code: 200
  loop: "{{ _bmc_hosts }}"
  loop_control:
    label: "{{ item.name | default(item.address) }}"
  register: _bmc_auth_results
  failed_when: false

- name: BMC credentials — accumulate auth failures
  when:
    - _bmc_auth_results is defined
    - not item.skipped | default(false)
    - item.status is defined
    - item.status != 200
  ansible.builtin.set_fact:
    preflight_findings: >-
      {{ preflight_findings + [{
        'id': 'bmc_redfish_authentication',
        'message': 'BMC ' ~ (item.item.name | default(item.item.address))
          ~ ' (' ~ item.item.address ~ ') Redfish auth failed: HTTP '
          ~ (item.status | default('unreachable'))
      }] }}
    preflight_bmc_cred_failed: true
    preflight_skip_bmc_hardware: true
  loop: "{{ _bmc_auth_results.results | default([]) }}"
  loop_control:
    label: "{{ item.item.name | default(item.item.address) }}"

- name: BMC credentials — gate hardware checks on success
  ansible.builtin.set_fact:
    preflight_skip_bmc_hardware: "{{ preflight_bmc_cred_failed | bool }}"
  when:
    - _bmc_auth_results is defined
    - not (_bmc_auth_results.skipped | default(false))
