---
# Scenario: all validation checks pass (regression golden path).
name: baseline-pass
description: Hub 4.20+, BMC auth OK, virtual media privileges OK, install firewall ports open.

validation_mode: harness
expect:
  exit_code: 0
  blocking: []

inputs:
  hub:
    ocp_version: "4.20.1"
    idrac_generation: "10"
    min_ocp_version_idrac10: "4.20.0"
  bmc:
    hosts:
      - name: control-plane-01
        address: "127.0.0.1"
        port: 8000
    credentials:
      username: root
      password: calvin
    virtual_media_privilege: administrator
  network:
    probe_from: local
    firewall_checks:
      - id: virtual-media-http
        port: 6180
        targets:
          - host: "127.0.0.1"
            port: 6180
        state: open
      - id: virtual-media-https
        port: 6183
        targets:
          - host: "127.0.0.1"
            port: 6183
        state: open
      - id: ironic-ipa
        port: 9999
        targets:
          - host: "127.0.0.1"
            port: 9999
        state: open
