---
# Hybrid network: real TCP probes against mock listeners (all install ports open).
name: network-hybrid-open
description: mock_listener on 6180/6183/9999 — wait_for probes succeed.

validation_mode: hybrid
expect:
  exit_code: 0
  blocking: []

inputs:
  hub:
    ocp_version: "4.20.1"
    idrac_generation: "10"
    min_ocp_version_idrac10: "4.20.0"
  bmc:
    hosts:
      - name: control-plane-01
        address: "127.0.0.1"
        port: 8000
    credentials:
      username: root
      password: calvin
    virtual_media_privilege: administrator
  network:
    probe_from: local
    firewall_checks:
      - id: virtual-media-http
        port: 6180
        mock_listener: true
        targets:
          - host: "127.0.0.1"
            port: 6180
      - id: virtual-media-https
        port: 6183
        mock_listener: true
        targets:
          - host: "127.0.0.1"
            port: 6183
      - id: ironic-ipa
        port: 9999
        mock_listener: true
        targets:
          - host: "127.0.0.1"
            port: 9999
