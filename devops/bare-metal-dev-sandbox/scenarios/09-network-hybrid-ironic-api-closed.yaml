---
# Hybrid network: real TCP probe fails on 6385 (Ironic API) with no mock listener.
name: network-hybrid-ironic-api-closed
description: 6385 closed via hybrid mock_listener; 9999 open for partial-block realism.

validation_mode: hybrid
expect:
  exit_code: 2
  blocking:
    - id: network_firewall_install_ports

inputs:
  hub:
    ocp_version: "4.20.1"
    idrac_generation: "10"
    min_ocp_version_idrac10: "4.20.0"
  bmc:
    hosts:
      - name: control-plane-01
        address: "127.0.0.1"
        port: 8000
    credentials:
      username: root
      password: calvin
    virtual_media_privilege: administrator
  network:
    probe_from: local
    firewall_checks:
      - id: ironic-api
        port: 6385
        mock_listener: false
        targets:
          - host: "127.0.0.1"
            port: 6385
      - id: ironic-ipa
        port: 9999
        mock_listener: true
        targets:
          - host: "127.0.0.1"
            port: 9999
