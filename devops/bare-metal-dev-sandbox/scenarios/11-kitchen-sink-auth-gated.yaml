---
# Scenario: auth failure plus other blockers — privilege must NOT appear (gating).
name: kitchen-sink-auth-gated
description: >
  Auth fails while hub and firewall also fail. Privilege check skipped;
  three blocking IDs without bmc_virtual_media_privilege.

validation_mode: harness
expect:
  exit_code: 2
  blocking:
    - id: hub_ocp_version_idrac10
    - id: bmc_redfish_authentication
    - id: network_firewall_install_ports
  not_blocking:
    - id: bmc_virtual_media_privilege

inputs:
  hub:
    ocp_version: "4.19.6"
    idrac_generation: "10"
    min_ocp_version_idrac10: "4.20.0"
  bmc:
    hosts:
      - name: control-plane-01
        address: "127.0.0.1"
        port: 8000
    credentials:
      username: root
      password: calvin
      auth_ok: false
    virtual_media_privilege: readonly
  network:
    probe_from: local
    firewall_checks:
      - id: ironic-ipa
        port: 9999
        targets:
          - host: "10.20.30.40"
            port: 9999
        state: closed
      - id: ironic-api
        port: 6385
        targets:
          - host: "10.20.30.40"
            port: 6385
        state: closed
