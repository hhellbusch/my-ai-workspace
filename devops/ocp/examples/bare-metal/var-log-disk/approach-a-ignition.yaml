# Approach A — Ignition storage in MachineConfig (declarative)
#
# Replace the by-path device after discovery on representative workers:
#   oc debug node/<node> -- chroot /host ls -la /dev/disk/by-path/ | grep nvme
#
# Apply:
#   oc apply -f approach-a-ignition.yaml
#
# Expect MCP worker rollout: drain → reboot per node.
#
# See README.md for semantics (wipeTable, partition number, 14TB sizing).
---
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  name: 99-worker-var-log-disk-ignition
  labels:
    machineconfiguration.openshift.io/role: worker
spec:
  config:
    ignition:
      version: 3.5.0
    storage:
      disks:
        - device: /dev/disk/by-path/pci-0000:3d:00.0-nvme-1
          wipeTable: false
          partitions:
            - number: 1
              label: var_log
              startMiB: 1
              sizeMiB: 262144
              shouldExist: true
              wipePartitionEntry: false
      filesystems:
        - device: /dev/disk/by-partlabel/var_log
          format: xfs
          label: var_log_fs
          wipeFilesystem: false
          path: /var/log
          with_mount_unit: true
          mountOptions:
            - defaults
            - noatime
      files:
        - path: /etc/systemd/journald.conf.d/99-var-log-limits.conf
          mode: 0644
          overwrite: true
          contents:
            inline: |
              [Journal]
              Storage=persistent
              SystemMaxUse=50G
              SystemKeepFree=10G
              SystemMaxFileSize=1G
              MaxRetentionSec=30day
              Compress=yes
