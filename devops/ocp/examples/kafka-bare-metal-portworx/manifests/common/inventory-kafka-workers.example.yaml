# Ansible inventory → ACM hub manifests (example structure)
#
# Keep rack, role, MAC, BMC, and disk hints in inventory; render BMH per host via
# Ansible template or Helm (baremetal-hosts app). Do not label nodes by hand post-install
# if you want Git to remain the source of truth for rack placement.
#
# File: inventory/prod-kafka/hosts.yaml (or group_vars)

kafka_workers:
  hosts:
    prod-kafka-worker-a1:
      rack: rack-a
      region: dc1
      boot_mac: "aa:bb:cc:dd:ee:01"
      bmc_address: bmc-a1.example.com
      root_device: /dev/nvme0n1
    prod-kafka-worker-b1:
      rack: rack-b
      region: dc1
      boot_mac: "aa:bb:cc:dd:ee:02"
      bmc_address: bmc-b1.example.com
      root_device: /dev/nvme0n1
    prod-kafka-worker-c1:
      rack: rack-c
      region: dc1
      boot_mac: "aa:bb:cc:dd:ee:03"
      bmc_address: bmc-c1.example.com
      root_device: /dev/nvme0n1

# Rendered labels per host (conceptual — your template maps rack → labels):
#   topology.kubernetes.io/zone: "{{ rack }}"
#   topology.kubernetes.io/region: "{{ region }}"
#   px/rack: "{{ rack }}"
#   node-role.kubernetes.io/kafka: ""
#   node-role.kubernetes.io/worker: ""
#
# For ACM agent install, emit as BMH annotations:
#   bmac.agent-install.openshift.io/node-label.topology.kubernetes.io/zone: "{{ rack }}"
#   ... etc
#
# For Metal3/IPI with spec.nodeLabels on spoke BMH (post-cluster or non-ACM path),
# see baremetal-hosts Helm chart: devops/argo/examples/framework/apps/baremetal-hosts/
