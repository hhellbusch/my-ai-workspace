# Optional kernel/sysctl tuning for worker nodes (OCP 4.20+).
#
# NOT applied by default in this example — Kafka brokers schedule on any worker,
# so this MachineConfig reboots every node in the default worker pool.
# Apply only if the sysctl/THP changes are acceptable for all workloads on workers.
#
# Ignition 3.5.0 is required for OpenShift Container Platform 4.20.
# https://docs.redhat.com/en/documentation/openshift_container_platform/4.20/html/machine_configuration/machine-configs-configure
apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: worker
  name: 99-kafka-kernel-tuning
spec:
  kernelArguments:
    - transparent_hugepage=never
  config:
    ignition:
      version: 3.5.0
      storage:
        files:
          - path: /etc/sysctl.d/99-kafka.conf
            mode: 0644
            contents:
              source: data:,vm.swappiness%3D1%0Avm.dirty_background_ratio%3D5%0Avm.dirty_ratio%3D10%0Anet.core.somaxconn%3D4096%0A
