apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: portworx-kafka-repl3
  annotations:
    description: "Portworx Kafka volumes — repl 3, one replica per rack"
provisioner: kubernetes.io/portworx-volume
parameters:
  repl: "3"
  io_profile: "db"
  priority_io: "high"
  shared: "false"
  # Comma-separated rack IDs — must match px/rack node labels
  racks: "rack-a,rack-b,rack-c"
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
