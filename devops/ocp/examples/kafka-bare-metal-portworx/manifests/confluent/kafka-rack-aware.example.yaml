# Confluent Platform Operator — rack-aware scheduling example
#
# API group/version varies by Confluent operator release. Verify with:
#   oc api-resources | grep -i confluent
#
# broker.rack is NOT set via topologyKey like Strimzi. Map node zone → broker.rack
# using your operator version's configuration mechanism (broker config, env, or init).
# See Confluent docs for: confluent.platform.rack / broker.rack
#
# This example focuses on pod scheduling + Portworx storage — wire broker.rack separately.

apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: prod-kafka
  namespace: kafka
spec:
  replicas: 3
  image:
  # application: confluentinc/cp-server — set per your mirror/version
  dataVolumeClaimTemplate:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 2Ti
    storageClassName: portworx-kafka-repl3
  podTemplate:
    tolerations:
      - key: dedicated
        value: kafka
        effect: NoSchedule
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - prod-kafka
            topologyKey: kubernetes.io/hostname
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/kafka
                  operator: Exists
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: prod-kafka
  # Example broker config surface — field name may differ by operator version
  configOverrides:
    server:
      - default.replication.factor=3
      - min.insync.replicas=2
      - offsets.topic.replication.factor=3
      - transaction.state.log.replication.factor=3
      - transaction.state.log.min.isr=2
      # Set per-broker via operator mechanism, e.g. rack ID from downward API:
      # - broker.rack=$(ZONE_FROM_NODE_LABEL)
