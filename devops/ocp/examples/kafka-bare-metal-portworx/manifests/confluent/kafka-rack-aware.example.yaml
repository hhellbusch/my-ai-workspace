# Confluent Platform Operator — rack-aware scheduling example (illustrative).
#
# BEFORE APPLY:
#   oc api-resources | grep -i confluent    # confirm API group/version
#   oc explain kafka.platform.confluent.io  # field names vary by operator release
#
# broker.rack is NOT set via topologyKey like Strimzi. Map node zone → broker.rack
# using your operator version's configuration mechanism.
#
# This manifest is NOT guaranteed to apply verbatim — treat as a scheduling/storage template.

apiVersion: platform.confluent.io/v1beta1
kind: Kafka
metadata:
  name: prod-kafka
  namespace: kafka
spec:
  replicas: 3
  image:
    application: confluentinc/cp-server:7.7.0  # REPLACE: mirror path and supported version
  dataVolumeClaimTemplate:
    accessModes:
      - ReadWriteOnce
    resources:
      requests:
        storage: 2Ti
    storageClassName: portworx-kafka-repl3
  podTemplate:
    tolerations:
      - key: dedicated
        value: kafka
        effect: NoSchedule
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - prod-kafka
            topologyKey: kubernetes.io/hostname
      nodeAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
            - matchExpressions:
                - key: node-role.kubernetes.io/kafka
                  operator: Exists
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: topology.kubernetes.io/zone
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app: prod-kafka
  configOverrides:
    server:
      - default.replication.factor=3
      - min.insync.replicas=2
      - offsets.topic.replication.factor=3
      - transaction.state.log.replication.factor=3
      - transaction.state.log.min.isr=2
      # Wire broker.rack per operator docs — not a literal value:
      # - broker.rack=<from topology.kubernetes.io/zone via downward API or init>
