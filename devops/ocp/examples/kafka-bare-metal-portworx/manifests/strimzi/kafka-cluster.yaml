# Strimzi / AMQ Streams — Kafka cluster (KRaft)
#
# Target: OCP 4.20+ with Streams for Apache Kafka 3.1 (Kafka 4.1, Strimzi 0.48.x)
# or upstream Strimzi 0.48+.
#
# Prerequisites:
#   - KafkaNodePool CRDs applied before this resource
#   - Operator version must support Kafka 4.1.0 / metadataVersion 4.1-IV1
#
# Apply after kafkanodepool-*.yaml. Operator must be installed in namespace.
# Production: add a TLS listener (plain 9092 below is example-only).
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: prod-kafka
  namespace: kafka
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 4.1.0
    metadataVersion: 4.1-IV1
    listeners:
      - name: internal
        port: 9092
        type: internal
        tls: false
    config:
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      num.network.threads: 8
      num.io.threads: 16
      log.retention.hours: 168
    # Sets broker.rack from node label — Kafka spreads partition replicas across racks
    rack:
      topologyKey: topology.kubernetes.io/zone
  entityOperator:
    topicOperator: {}
    userOperator: {}
