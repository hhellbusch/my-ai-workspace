# Custom-rack variant — Ansible inventory → label mapping
# Compare: ../zone-region/inventory-workers.example.yaml · ../../LABELING-COMPARISON.md

workers:
  hosts:
    prod-worker-a1:
      rack: rack-a
      site: dc1
      boot_mac: "aa:bb:cc:dd:ee:01"
      bmc_address: bmc-a1.example.com
      root_device: /dev/nvme0n1
    prod-worker-b1:
      rack: rack-b
      site: dc1
      boot_mac: "aa:bb:cc:dd:ee:02"
      bmc_address: bmc-b1.example.com
      root_device: /dev/nvme0n1
    prod-worker-c1:
      rack: rack-c
      site: dc1
      boot_mac: "aa:bb:cc:dd:ee:03"
      bmc_address: bmc-c1.example.com
      root_device: /dev/nvme0n1

