apiVersion: v1
kind: ConfigMap
metadata:
  name: clusterlink-dc-a-to-dc-b-spec
  namespace: confluent
  annotations:
    argocd.argoproj.io/sync-wave: "15"
data:
  link.desired.yaml: |
    # Inline copy of desired/dc-a-to-dc-b.yaml — or use Kustomize/Helm to inject from Git.
    # In production, prefer syncing this ConfigMap from the same Git path as the Job.
    apiVersion: clusterlink.example/v1
    kind: ClusterLinkDesired
    metadata:
      name: dc-a-to-dc-b
    spec:
      linkName: dr-cross-dc
      managedOn:
        clusterId: dc-b
        namespace: confluent
      destination:
        kafkaClusterName: kafka
        kafkaRestClassRef:
          name: krc-local
          namespace: confluent
      source:
        clusterId: ""
        bootstrapEndpoint: "10.200.1.21:9095,10.200.1.22:9095,10.200.1.23:9095"
        kafkaRestClassRef:
          name: krc-dc-a
          namespace: confluent
      tls:
        enabled: true
      mirrorTopics:
        - name: "*"
          prefix: "dc-a."
