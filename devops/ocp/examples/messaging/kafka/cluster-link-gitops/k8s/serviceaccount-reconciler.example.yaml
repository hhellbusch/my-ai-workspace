apiVersion: v1
kind: ServiceAccount
metadata:
  name: clusterlink-reconciler
  namespace: confluent
  annotations:
    argocd.argoproj.io/sync-wave: "15"
---
# Minimal RBAC — adjust if your platform requires NetworkPolicy egress to Admin REST only.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: clusterlink-reconciler
  namespace: confluent
rules: []
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: clusterlink-reconciler
  namespace: confluent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: clusterlink-reconciler
subjects:
  - kind: ServiceAccount
    name: clusterlink-reconciler
    namespace: confluent
