{{- if .Values.multiNetworkPolicy.defaultDenyOnNad }}
{{- $wl := .Values.workload }}
{{- $policyFor := printf "%s/%s" $wl.namespace $wl.nadName }}
# Catch-all deny on the replication NAD — mis-attachment defense.
# Brokers get exceptions from {{ $wl.nadName }}-restrict. See MULTINETWORKPOLICY.md.
apiVersion: k8s.cni.cncf.io/v1beta1
kind: MultiNetworkPolicy
metadata:
  name: {{ $wl.nadName }}-default-deny
  namespace: {{ $wl.namespace }}
  labels:
    app.kubernetes.io/part-of: cross-dc-replication
  annotations:
    k8s.v1.cni.cncf.io/policy-for: {{ $policyFor }}
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
{{- end }}
