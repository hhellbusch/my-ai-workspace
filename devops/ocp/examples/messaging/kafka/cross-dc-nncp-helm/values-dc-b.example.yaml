# Example values for DC-B's cluster. Replace hostnames/IPs with real inventory.
# DC-B's replication subnet: 10.200.2.0/26. Remote (DC-A) subnet: 10.200.1.0/26.

replicationNetwork:
  bondName: bond-repl
  bondMode: active-backup
  ports:
    - ens4f0
    - ens5f0
  vlanId: 200
  prefixLength: 26
  maxUnavailable: 1
  localGateway: 10.200.2.1
  remoteSubnet: 10.200.1.0/26

nodes:
  - hostname: worker-0.dc-b.example.com
    ip: 10.200.2.11
  - hostname: worker-1.dc-b.example.com
    ip: 10.200.2.12
  - hostname: worker-2.dc-b.example.com
    ip: 10.200.2.13
