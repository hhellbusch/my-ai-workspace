# Dedicated IngressController for cross-DC Kafka replication.
# Adjust domain, labels, nodeSelector, and ports for your site.
# See examples/ingress-replication/README.md
#
# HostNetwork: OpenShift allows only ONE HostNetwork IngressController per node.
# Schedule this shard on repl-gateway workers that do NOT already run the default
# (or any other) HostNetwork router — e.g. not on masters if default ingress is there.

apiVersion: operator.openshift.io/v1
kind: IngressController
metadata:
  name: replication
  namespace: openshift-ingress-operator
spec:
  domain: kafka-repl.dc-a.example.com
  routeSelector:
    matchLabels:
      ingress: replication
  nodePlacement:
    nodeSelector:
      matchLabels:
        node-role.kubernetes.io/repl-gateway: ""
  endpointPublishingStrategy:
    type: HostNetwork
    hostNetwork:
      httpPort: 8080
      httpsPort: 8443
      statsPort: 1936
  # tuningOptions:
  #   threadCount: 4
