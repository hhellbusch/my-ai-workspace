# Dedicated IngressController for cross-DC Kafka replication.
# Adjust domain, labels, nodeSelector, and ports for your site.
# See examples/ingress-replication/README.md

apiVersion: operator.openshift.io/v1
kind: IngressController
metadata:
  name: replication
  namespace: openshift-ingress-operator
spec:
  domain: kafka-repl.dc-a.example.com
  routeSelector:
    matchLabels:
      ingress: replication
  nodePlacement:
    nodeSelector:
      matchLabels:
        node-role.kubernetes.io/repl-gateway: ""
  endpointPublishingStrategy:
    type: HostNetwork
    hostNetwork:
      httpPort: 8080
      httpsPort: 8443
      statsPort: 1936
  # tuningOptions:
  #   threadCount: 4
