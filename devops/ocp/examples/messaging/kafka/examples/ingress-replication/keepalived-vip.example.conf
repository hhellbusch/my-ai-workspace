# Keepalived VIP on replication VLAN — example only
# Install via MachineConfig, systemd unit on repl-gateway nodes, or site automation.
# Verify VRRP is allowed on the VLAN (multicast or unicast peers per your design).

global_defs {
    script_user root
    enable_script_security
}

vrrp_script chk_router_https {
    # Adjust path/port to match IngressController hostNetwork httpsPort (8443 in examples)
    script "/usr/bin/curl -sk --max-time 2 https://127.0.0.1:8443/healthz || exit 1"
    interval 3
    weight -20
    fall 2
    rise 2
}

vrrp_instance REPL_INGRESS_VIP {
    state BACKUP
    interface bond-repl.200
    virtual_router_id 42
    priority 100
    advert_int 1
    # unicast_src_ip 10.200.1.11
    # unicast_peer {
    #     10.200.1.12
    # }
    authentication {
        auth_type PASS
        auth_pass repl-ingress-secret
    }
    virtual_ipaddress {
        10.200.1.5/26 dev bond-repl.200
    }
    track_script {
        chk_router_https
    }
}

# Notes:
# - One node MASTER, others BACKUP with lower priority; or use unicast VRRP if multicast blocked.
# - VIP must NOT overlap router node repl IPs or Kafka/static assignments.
# - Publish DNAT or bind so WAN clients hit :443 on the VIP and reach router :8443.
# - Red Hat documents platform ingress VIP separately — confirm non-default shard + HostNetwork
#   on your OCP version (see cross-dc-ingress-alternative.md open questions).
