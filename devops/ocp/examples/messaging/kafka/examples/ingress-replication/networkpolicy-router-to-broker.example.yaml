# Optional: restrict direct broker :9095 access on OVN to replication router pods only.
# Route creation is governed by RBAC, not NetworkPolicy.
# Adjust namespaceSelector/podSelector to match your router deployment labels.

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-replication-from-router-only
  namespace: confluent
spec:
  podSelector:
    matchLabels:
      app: kafka
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-ingress
          podSelector:
            matchLabels:
              ingresscontroller.operator.openshift.io/deployment-ingress-controller: replication
      ports:
        - protocol: TCP
          port: 9095
