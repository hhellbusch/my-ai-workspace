# Inventory for DC-B — dedicated ingress shard path (replicationPath: ingress)
# Copy to inventory-dc-b.yaml and fill real values.
# Renders NNCP + ingress test env only (no Kafka NAD/MultiNetworkPolicy).
#
#   ./render-config.py --inventory inventory-dc-b.yaml
#   ./render-config.py --both --firewall-request-ingress firewall-ingress.md --dns-request dns.md

replicationPath: ingress

cluster:
  id: dc-b
  kubeconfig: "${HOME}/.kube/dc-b.kubeconfig"

replicationNetwork:
  bondName: bond-repl
  bondMode: active-backup
  ports:
    - ens4f0
    - ens5f0
  vlanId: 200
  prefixLength: 26
  localSubnet: 10.200.2.0/26
  localGateway: 10.200.2.1
  remoteSubnet: 10.200.1.0/26
  expectedMtu: 1500

nodes:
  - hostname: worker-0.dc-b.example.com
    hostIp: 10.200.2.11
    networkTest: false
  - hostname: worker-1.dc-b.example.com
    hostIp: 10.200.2.12
    networkTest: false

ipPools:
  test:
    range: 10.200.2.0/26
    start: 10.200.2.6
    end: 10.200.2.10

ingress:
  domain: kafka-repl.dc-b.example.com
  routeLabel:
    ingress: replication
  frontendMode: vip
  vip: 10.200.2.5
  dnsTargets: []
  externalPort: 443
  dnsTtl: 60

probe:
  image: quay.io/rh_hhellbusch/repl-net-probe:0.1.1
