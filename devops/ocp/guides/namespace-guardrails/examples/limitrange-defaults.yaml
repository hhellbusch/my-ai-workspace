# LimitRange — per-container defaults for a tenant namespace.
# Pair with a ResourceQuota; LimitRange shapes individual pods, ResourceQuota caps namespace totals.
apiVersion: v1
kind: LimitRange
metadata:
  name: tenant-defaults
spec:
  limits:
    - type: Container
      default:
        cpu: "500m"
        memory: 512Mi
      defaultRequest:
        cpu: "100m"
        memory: 128Mi
      max:
        cpu: "4"
        memory: 8Gi
      min:
        cpu: "10m"
        memory: 16Mi
      maxLimitRequestRatio:
        cpu: "10"
        memory: "4"
