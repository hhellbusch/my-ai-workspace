# Hub cluster namespace — cert material consumed by the postinstall playbook.
# Prefer SealedSecret / ExternalSecret in production; this is illustrative only.
---
apiVersion: v1
kind: Secret
metadata:
  name: api-cert-material
  namespace: prod-bm-01
type: Opaque
stringData:
  # API serving certificate (PEM) — must match api_dns_name SANs
  tls.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_ME
    -----END CERTIFICATE-----
  tls.key: |
    -----BEGIN PRIVATE KEY-----
    REPLACE_ME
    -----END PRIVATE KEY-----
  # CA (or chain) clients use to verify the API after rollout.
  # Patched into hub admin kubeconfig certificate-authority-data.
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    REPLACE_ME
    -----END CERTIFICATE-----
