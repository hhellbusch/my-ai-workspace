# Applied to spoke openshift-config by the postinstall playbook.
# Equivalent to: oc create secret tls custom-api-tls -n openshift-config ...
---
apiVersion: v1
kind: Secret
metadata:
  name: custom-api-tls
  namespace: openshift-config
type: kubernetes.io/tls
data:
  tls.crt: ""   # base64 — playbook applies from cert-material secret
  tls.key: ""   # base64
