site_name: Field Notes
site_description: Engineering reference and essays — DevOps troubleshooting, examples, and AI-assisted practice.
site_url: https://hhellbusch.github.io/gemini-workspace/
repo_url: https://github.com/hhellbusch/gemini-workspace
repo_name: hhellbusch/gemini-workspace

docs_dir: site-staging
strict: false

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

# Nav is generated before build — see scripts/generate-mkdocs-nav.py
nav:
  - Home: index.md

extra:
  generator: false
