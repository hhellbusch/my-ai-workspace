apiVersion: v1
kind: Namespace
metadata:
  name: benchmark
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: batch/v1
kind: Job
metadata:
  name: sysbench-cpu
  namespace: benchmark
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sysbench
          image: quay.io/rh_hhellbusch/sysbench:1.0.20
          args:
            - cpu
            - --cpu-max-prime=20000
            - --threads=4
            - run
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "4"
              memory: "1Gi"
            limits:
              cpu: "4"
              memory: "1Gi"
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: sysbench-memory
  namespace: benchmark
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: sysbench
          image: quay.io/rh_hhellbusch/sysbench:1.0.20
          args:
            - memory
            - --threads=4
            - run
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: "4"
              memory: "4Gi"
            limits:
              cpu: "4"
              memory: "4Gi"
      volumes:
        - name: tmp
          emptyDir: {}
